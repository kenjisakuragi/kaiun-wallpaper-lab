# ローカル D1 にマイグレーションを当てるための設定（`pnpm db:migrate:local`）。
# database_id はローカル用の仮の値。本番の ID は D1_DATABASE_ID（環境変数）で、M7 の apps/edge で設定する。
# 確認：https://developers.cloudflare.com/d1/reference/migrations/ （2026-10-04）
name = "kaiun-db"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "kaiun"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
