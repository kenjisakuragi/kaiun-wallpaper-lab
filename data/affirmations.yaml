# アファメーション（引き寄せ系の短い言葉）初版。人がレビューして増減する（docs/09 #23）。
# 使い道：Threads・Instagram のアファメーション版の本文（docs/03 §2-1）、LINE「今日のひと言」（docs/03 §5-1）。
# ルール：40文字以内。効果や結果を約束しない（「必ず〜になる」等を書かない）。不安をあおらない。健康・医療に触れない。
# id は a001 から連番。削除するときは id を詰めずに消す（過去の配信記録と対応させるため）。
- id: a001
  text: 私は私のペースで進んでいい。
- id: a002
  text: 今日の小さな一歩を、ちゃんと褒めてあげよう。
- id: a003
  text: うれしいことに気づく力が、私にはある。
- id: a004
  text: 私は、私の好きなものを大切にしていい。
- id: a005
  text: 深呼吸をひとつ。いまの私で大丈夫。
- id: a006
  text: 新しい流れを、気持ちよく迎え入れる。
- id: a007
  text: 私のまわりには、やさしいご縁がある。
- id: a008
  text: 今日は、自分に少しだけ甘くしていい日。
- id: a009
  text: 私の言葉は、私の味方でいてくれる。
- id: a010
  text: できたことを数えると、心が軽くなる。
- id: a011
  text: 私は、受け取ることを自分に許している。
- id: a012
  text: ゆっくりでも、ちゃんと前に進んでいる。
- id: a013
  text: 私の笑顔は、まわりをあたためている。
- id: a014
  text: 迷ったら、心がわくわくする方へ。
- id: a015
  text: 私は、私の気持ちを大切に扱う。
- id: a016
  text: 今日出会うものに、ありがとうを。
- id: a017
  text: 私の中には、まだ知らない可能性がある。
- id: a018
  text: 比べなくていい。私には私の物語がある。
- id: a019
  text: 豊かさは、気づいたところから広がっていく。
- id: a020
  text: 私は、私の選んだ道を信じている。
- id: a021
  text: ほっとする時間を、今日もひとつ持とう。
- id: a022
  text: 私は、変わっていく自分を楽しんでいる。
- id: a023
  text: いいことは、思いがけない形でやってくる。
- id: a024
  text: 私の毎日は、少しずつ整っていく。
- id: a025
  text: 今日の私に、花まるをあげよう。
- id: a026
  text: 私は、やさしさを受け取る準備ができている。
- id: a027
  text: 手放すと、新しいものが入る場所ができる。
- id: a028
  text: 私の願いは、私を前に進める道しるべ。
- id: a029
  text: 好きなことをしている私が、いちばん私らしい。
- id: a030
  text: 心地よいものを、ひとつずつ選んでいく。
- id: a031
  text: 私は、自分との約束を大切にする。
- id: a032
  text: 今日もここにいる自分に、ありがとう。
- id: a033
  text: 私の毎日には、小さな奇跡がかくれている。
- id: a034
  text: 力を抜くと、流れはやわらかくなる。
- id: a035
  text: 私は、私を応援する一番の人。
- id: a036
  text: きのうより、ほんの少しだけ軽やかに。
- id: a037
  text: 私には、いま必要なものがそろっている。
- id: a038
  text: 楽しい予感を、胸にしまって出かけよう。
- id: a039
  text: 私の感じたことは、どれも大切な答え。
- id: a040
  text: 疲れたら休む。それも前に進むこと。
- id: a041
  text: 私は、まわりの人の幸せも願える人。
- id: a042
  text: うまくいったときの気持ちを、先に味わおう。
- id: a043
  text: 私の毎日は、私がえらんだ色で彩られる。
- id: a044
  text: 心がふわっとすることを、今日はひとつ。
- id: a045
  text: 私は、新しいことに挑戦する自分が好き。
- id: a046
  text: ありがとうと言える日は、いい日。
- id: a047
  text: 私の夢は、私が叶えてあげたいもの。
- id: a048
  text: ちいさな「好き」を集めて、今日をつくる。
- id: a049
  text: 私は、自分のよいところを知っている。
- id: a050
  text: 空を見上げる余裕を、今日も持とう。
- id: a051
  text: 私のタイミングは、ちょうどいいときにやってくる。
- id: a052
  text: 大切な人を思い浮かべると、心があたたまる。
- id: a053
  text: 私は、変化をこわがらなくていい。
- id: a054
  text: 今日のがんばりは、明日の私への贈りもの。
- id: a055
  text: 心の声に、そっと耳をすませてみよう。
- id: a056
  text: 私は、豊かさを分かち合える人になる。
- id: a057
  text: 余白のある一日に、いいことは入ってくる。
- id: a058
  text: 私の歩いてきた道は、ちゃんと意味がある。
- id: a059
  text: 今日はどんなうれしいことがあるかな。
- id: a060
  text: 私は、私に生まれてよかった。
- id: a061
  text: やさしい言葉を、まず自分にかけよう。
- id: a062
  text: ひとつ終えたら、ひとつ楽しみを。
